name: Lint and Format

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging

jobs:
  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        id: eslint
        run: npm run lint

      - name: Annotate ESLint Fix Suggestion
        if: failure() && steps.eslint.outcome == 'failure'
        run: |
          echo "::error title=ESLint Check Failed::ESLint found errors or style violations in the codebase. Fix locally by running: npm run lint:fix"

      - name: Run Prettier check
        id: prettier
        run: npm run format:check

      - name: Annotate Prettier Fix Suggestion
        if: failure() && steps.prettier.outcome == 'failure'
        run: |
          echo "::error title=Prettier Check Failed::Code formatting check failed. Fix code formatting locally by running: npm run format"

