name: Tests

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging

jobs:
  tests:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with Jest
        id: test-run
        env:
          NODE_ENV: test
          NODE_OPTIONS: --experimental-vm-modules
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db?sslmode=disable
          ARCJET_KEY: aj_test_dummy_key_for_ci
          JWT_SECRET: test_jwt_secret_key_ci_only
        run: npm test

      - name: Annotate test failure
        if: failure() && steps.test-run.outcome == 'failure'
        run: |
          echo "::error title=Jest Test Suite Failed::One or more tests failed. Check the workflow logs above for stack traces and failure details."

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

      - name: Generate GitHub Step Summary
        if: always()
        run: |
          echo "## 🧪 Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.test-run.outcome }}" = "success" ]; then
            echo "✅ **All tests passed successfully!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Test suite failed.** Please check annotations and detailed job logs." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Coverage Status" >> $GITHUB_STEP_SUMMARY
          if [ -f coverage/coverage-summary.json ]; then
            echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
            cat coverage/coverage-summary.json >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          elif [ -f coverage/lcov-report/index.html ]; then
            echo "Coverage report HTML generated and uploaded as artifact \`coverage-report\` (retention: 30 days)." >> $GITHUB_STEP_SUMMARY
          else
            echo "Coverage output files generated in \`coverage/\` folder and preserved as workflow artifact." >> $GITHUB_STEP_SUMMARY
          fi

