services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: acquisitions-app-prod
    restart: always
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env.production
    networks:
      - acquisitions-prod-network

networks:
  acquisitions-prod-network:
    driver: bridge

