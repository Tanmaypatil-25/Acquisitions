services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: acquisitions-app-dev
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    env_file:
      - .env.development
    volumes:
      # Mount workspace for instant hot-reload during local development
      - .:/app
      - /app/node_modules
    depends_on:
      neon-local:
        condition: service_started
    networks:
      - acquisitions-network

  neon-local:
    image: neondatabase/neon_local:latest
    container_name: acquisitions-neon-local
    restart: unless-stopped
    ports:
      # Exposes local postgres proxy on host 5432 (for host tools like drizzle studio, psql, etc.)
      - '5432:5432'
    env_file:
      - .env.development
    networks:
      - acquisitions-network

networks:
  acquisitions-network:
    driver: bridge
